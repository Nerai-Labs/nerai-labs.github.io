name: ci
on:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: "! grep -r FAILCI app components"
      - run: npm install --no-audit --no-fund
      - run: npm run build
